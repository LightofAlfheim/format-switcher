name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The GitHub runner image ships with the Android SDK preinstalled here.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || yes | "$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | head -1)/sdkmanager" --licenses > /dev/null || true

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/*.apk FormatSwitcher.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FormatSwitcher-apk
          path: FormatSwitcher.apk

      - name: Publish APK to the "latest" release (easy phone download)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FormatSwitcher.apk \
            --title "Format Switcher (latest build)" \
            --notes "Tap FormatSwitcher.apk below to download, then open it on your phone to install. Built from commit ${GITHUB_SHA::7}."
